<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>docx 解析校验</title>
    <style>
      body { margin: 0; font: 13px/1.5 -apple-system, sans-serif; background: #eef1f5; }
      .bar { padding: 10px 14px; background: #1f2329; color: #fff; }
      .wrap { display: flex; gap: 14px; padding: 14px; align-items: flex-start; }
      .pane { background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
      pre { margin: 0; padding: 10px; width: 520px; height: 700px; overflow: auto; font-size: 11px; white-space: pre-wrap; word-break: break-all; }
      iframe { width: 794px; height: 700px; border: 0; display: block; }
      h3 { margin: 0; padding: 8px 10px; font-size: 12px; color: #4e5969; border-bottom: 1px solid #e5e7eb; }
    </style>
  </head>
  <body>
    <div class="bar" id="status">正在转换…</div>
    <div class="wrap">
      <div class="pane"><h3>生成的模板 HTML</h3><pre id="out"></pre></div>
      <div class="pane"><h3>按 A4 渲染效果</h3><iframe id="view"></iframe></div>
    </div>

    <script type="module">
      import JSZip from 'jszip';
      import { docxToTemplate } from '/src/template/docxImport.ts';

      const W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
      const DOC_NS = `
        xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
        xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
        xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
        xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"
        xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"`;

      const DOCUMENT_XML = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document ${DOC_NS}>
  <w:body>
    <w:p>
      <w:pPr><w:jc w:val="center"/><w:spacing w:after="120"/>
        <w:rPr><w:b/><w:sz w:val="32"/><w:rFonts w:ascii="Arial" w:eastAsia="黑体"/></w:rPr>
      </w:pPr>
      <w:r><w:t>劳动者个人信息卡</w:t></w:r>
    </w:p>

    <w:p>
      <w:r><w:rPr><w:sz w:val="24"/></w:rPr><w:t>档案号：1021310</w:t></w:r>
    </w:p>

    <w:tbl>
      <w:tblPr>
        <w:tblW w:w="9000" w:type="dxa"/>
        <w:jc w:val="center"/>
        <w:tblBorders>
          <w:top w:val="single" w:sz="8" w:color="000000"/>
          <w:left w:val="single" w:sz="8" w:color="000000"/>
          <w:bottom w:val="single" w:sz="8" w:color="000000"/>
          <w:right w:val="single" w:sz="8" w:color="000000"/>
          <w:insideH w:val="single" w:sz="4" w:color="808080"/>
          <w:insideV w:val="single" w:sz="4" w:color="808080"/>
        </w:tblBorders>
        <w:tblCellMar>
          <w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/>
          <w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/>
        </w:tblCellMar>
      </w:tblPr>
      <w:tblGrid>
        <w:gridCol w:w="1800"/><w:gridCol w:w="1800"/><w:gridCol w:w="1800"/>
        <w:gridCol w:w="1800"/><w:gridCol w:w="1800"/>
      </w:tblGrid>
      <w:tr>
        <w:trPr><w:trHeight w:val="420"/></w:trPr>
        <w:tc><w:tcPr><w:shd w:val="clear" w:fill="F2F2F2"/><w:vAlign w:val="center"/></w:tcPr>
          <w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:t>姓　名</w:t></w:r></w:p></w:tc>
        <w:tc><w:tcPr><w:vAlign w:val="center"/></w:tcPr>
          <w:p><w:r><w:t>张三</w:t></w:r></w:p></w:tc>
        <w:tc><w:tcPr><w:shd w:val="clear" w:fill="F2F2F2"/><w:vAlign w:val="center"/></w:tcPr>
          <w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:t>性别</w:t></w:r></w:p></w:tc>
        <w:tc><w:tcPr><w:vAlign w:val="center"/></w:tcPr>
          <w:p><w:r><w:t>男</w:t></w:r></w:p></w:tc>
        <w:tc><w:tcPr><w:vMerge w:val="restart"/><w:vAlign w:val="center"/></w:tcPr>
          <w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:t>照　片</w:t></w:r></w:p></w:tc>
      </w:tr>
      <w:tr>
        <w:tc><w:tcPr><w:gridSpan w:val="2"/><w:shd w:val="clear" w:fill="F2F2F2"/></w:tcPr>
          <w:p><w:r><w:t>身份证号</w:t></w:r></w:p></w:tc>
        <w:tc><w:tcPr><w:gridSpan w:val="2"/></w:tcPr>
          <w:p><w:r><w:t>110101199001011234</w:t></w:r></w:p></w:tc>
        <w:tc><w:tcPr><w:vMerge/></w:tcPr><w:p/></w:tc>
      </w:tr>
      <w:tr>
        <w:tc><w:tcPr><w:gridSpan w:val="4"/></w:tcPr>
          <w:p><w:r><w:t>下面这个二维码应当只有 45pt 见方：</w:t></w:r></w:p></w:tc>
        <w:tc><w:tcPr><w:vMerge/></w:tcPr><w:p/></w:tc>
      </w:tr>
      <w:tr>
        <w:tc><w:tcPr><w:gridSpan w:val="5"/></w:tcPr>
          <w:p>
            <w:r><w:drawing><wp:inline>
              <wp:extent cx="571500" cy="571500"/>
              <a:graphic><a:graphicData><pic:pic><pic:blipFill>
                <a:blip r:embed="rIdImg"/>
              </pic:blipFill></pic:pic></a:graphicData></a:graphic>
            </wp:inline></w:drawing></w:r>
          </w:p></w:tc>
      </w:tr>
    </w:tbl>

    <w:p>
      <w:pPr><w:jc w:val="right"/></w:pPr>
      <w:r><w:rPr><w:sz w:val="18"/><w:color w:val="808080"/></w:rPr>
        <w:t>本人签名：____________</w:t></w:r>
    </w:p>

    <w:sectPr>
      <w:pgSz w:w="11906" w:h="16838"/>
      <w:pgMar w:top="1440" w:right="1800" w:bottom="1440" w:left="1800"/>
    </w:sectPr>
  </w:body>
</w:document>`;

      const STYLES_XML = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles ${W}>
  <w:docDefaults>
    <w:rPrDefault><w:rPr>
      <w:rFonts w:ascii="Times New Roman" w:eastAsia="宋体"/>
      <w:sz w:val="21"/>
    </w:rPr></w:rPrDefault>
    <w:pPrDefault><w:pPr>
      <w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/>
    </w:pPr></w:pPrDefault>
  </w:docDefaults>
</w:styles>`;

      const RELS_XML = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rIdImg" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/qr.png"/>
</Relationships>`;

      const PNG_1PX =
        'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';

      async function buildDocx() {
        const zip = new JSZip();
        zip.file('word/document.xml', DOCUMENT_XML);
        zip.file('word/styles.xml', STYLES_XML);
        zip.file('word/_rels/document.xml.rels', RELS_XML);
        zip.file('word/media/qr.png', PNG_1PX, { base64: true });
        return zip.generateAsync({ type: 'arraybuffer' });
      }

      const status = document.getElementById('status');
      const out = document.getElementById('out');
      const view = document.getElementById('view');

      // 支持 ?file=<url> 加载真实 .docx 做回归；不带参数则用内置示例
      const sampleUrl = new URLSearchParams(location.search).get('file');

      try {
        const data = sampleUrl
          ? await (await fetch(sampleUrl)).arrayBuffer()
          : await buildDocx();
        const html = await docxToTemplate(data);
        out.textContent = html;
        // 应用内预览/导出会注入 html,body{margin:0}（见 buildDocument），这里对齐以还原真实效果
        view.srcdoc = html.replace(/<head>/i, '<head><style>html,body{margin:0}</style>');
        status.textContent = `转换成功 · ${sampleUrl ?? '内置示例'} · ${html.length} 字符`;
      } catch (error) {
        status.textContent = `转换失败：${error.message}`;
        out.textContent = String(error.stack ?? error);
      }
    </script>
  </body>
</html>
